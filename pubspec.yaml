name: globaledu_ai
description: AI-powered study abroad assistant - from planning to visa approval.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.2.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Networking
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Subscriptions
  purchases_flutter: ^8.1.0

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0

  # UI Enhancements
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  glassmorphism_ui: ^0.3.0
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2
  intl: ^0.20.2
  easy_localization: ^3.0.7
  logger: ^2.4.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  timeago: ^3.7.0
  flutter_markdown: ^0.7.3
  percent_indicator: ^4.2.3

  # Environment
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/translations/
